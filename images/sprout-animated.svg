<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><style>
.d{stroke-dasharray:1 1;stroke-dashoffset:1;animation:draw 6s cubic-bezier(.6,0,.3,1) infinite}
.g{transform-box:view-box;transform:scale(0);animation:grow 6s cubic-bezier(.3,1.4,.5,1) infinite}
@keyframes draw{0%{stroke-dashoffset:1;opacity:1}12%,88%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
@keyframes grow{0%{transform:scale(0) rotate(-20deg);opacity:1}12%{transform:scale(1) rotate(0)}50%{transform:scale(1) rotate(-3deg)}88%{transform:scale(1) rotate(0);opacity:1}100%{transform:scale(1) rotate(0);opacity:0}}
@media (prefers-reduced-motion:reduce){.d,.g{animation:none;transform:none;stroke-dashoffset:0}}
</style><defs><linearGradient id="t" gradientUnits="userSpaceOnUse" x1="40" y1="30" x2="170" y2="170"><stop offset="0" stop-color="#5a3a5c"/><stop offset="1" stop-color="#2c1830"/></linearGradient><linearGradient id="c" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8917a"/><stop offset="1" stop-color="#c9654b"/></linearGradient></defs>
