  <path class="g" style="transform-origin:100px 118px;animation-delay:.4s" d="M100 118 C92 92 72 76 40 74 C44 102 66 120 100 118 Z" fill="url(#c)"/>
  <path class="d" pathLength="1" style="animation-delay:.9s" d="M88 110 C76 100 66 92 54 84" fill="none" stroke="#fffcfa" stroke-width="3" stroke-linecap="round"/>
  <path class="g" style="transform-origin:103px 100px;animation-delay:.7s" d="M103 100 C106 62 128 40 164 34 C162 72 140 98 103 100 Z" fill="url(#t)"/>
  <path class="d" pathLength="1" style="animation-delay:1.2s" d="M114 88 C128 72 140 60 152 48" fill="none" stroke="#fffcfa" stroke-width="3.5" stroke-linecap="round"/>
</svg>
